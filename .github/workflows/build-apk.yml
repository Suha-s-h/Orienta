name: Build Orienta APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Test & Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-configuration-cache

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-configuration-cache --stacktrace

      - name: Upload Orienta APK
        uses: actions/upload-artifact@v4
        with:
          name: Orienta-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Write build summary
        if: always()
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ### Orienta CI Build
          - Unit tests (`testDebugUnitTest`) and Debug APK (`assembleDebug`) completed.
          - Download the installable APK from the **Artifacts** section of this workflow run.
          EOF
